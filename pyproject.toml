[project]
name = "sdguard"
version = "0.0.1"
description = "Compiles security rules from coding-agent instruction files into enforceable checks and detects protections lost across multi-turn agent sessions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
sdguard = "sdguard.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "semgrep>=1.185.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixture files are deliberately insecure example code for the compiler tests.
extend-exclude = ["docs", "spikes", "sdguard/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"sdguard/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["sdguard"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^sdguard/tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["sdguard/tests"]
